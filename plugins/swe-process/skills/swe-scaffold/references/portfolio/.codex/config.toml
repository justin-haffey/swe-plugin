# Portable Codex configuration for a portfolio/platform repository.
suppress_unstable_features_warning = true
allow_login_shell = true

[agents]
max_concurrent_threads_per_session = 8

[agents.codex_engineer]
description = "Design, revise, and validate Codex plugins, skills, custom agents, and prompt-rich repository instructions."
config_file = "agents/codex/codex-engineer.toml"

[agents.repo_author]
description = "Author repository-scoped AGENTS.md governance and factual README.md documentation."
config_file = "agents/swe/repo-author.toml"

[agents.platform_engineer]
description = "Implement portfolio-owned engineering changes, automation, and cross-solution integration work."
config_file = "agents/swe/platform-engineer.toml"

[agents.research_engineer]
description = "Investigate technical questions and produce evidence-backed portfolio research artifacts."
config_file = "agents/swe/research-engineer.toml"

[agents.platform_architect]
description = "Own platform architecture, platform ADRs, cross-solution contracts, and system views."
config_file = "agents/swe/platform-architect.toml"

[agents.feature_validator]
description = "Validate delivered features against portfolio acceptance criteria and recorded evidence."
config_file = "agents/swe/feature-validator.toml"

[agents.architecture_reviewer]
description = "Independently review and, when authorized, approve architecture artifacts and decisions."
config_file = "agents/swe/architecture-reviewer.toml"

[agents.integration_engineer]
description = "Verify cross-solution contracts, integration behavior, compatibility, and release readiness."
config_file = "agents/swe/integration-engineer.toml"

[features]
multi_agent_v2 = true
shell_tool = true

[mcp_servers.microsoft_learn]
url = "https://learn.microsoft.com/api/mcp"

[mcp_servers.ghostagram]
url = "http://127.0.0.1:5256/mcp"
enabled = true
required = false
startup_timeout_sec = 20.0
tool_timeout_sec = 60.0
enabled_tools = [
  "describe_capabilities",
  "list_diagrams",
  "open_session",
  "create_diagram",
  "get_diagram",
  "apply_operations",
  "layout_diagram",
  "export_svg",
  "close_session",
]
